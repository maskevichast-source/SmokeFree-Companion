services:
  bot:
    build:
      context: ./smokefree_bot
      dockerfile: Dockerfile
    container_name: smokefree_bot
    restart: always
    env_file:
      - ./smokefree_bot/.env
    environment:
      - DATABASE_URL=sqlite+aiosqlite:///./data/smokefree.db
      - PORT=8000
    ports:
      - "8000:8000"
    volumes:
      # Persistent Volume for SQLite Database:
      # Data is saved on the host in ./smokefree_bot/data and persists across all rebuilds/redeploys
      - ./smokefree_bot/data:/app/data
