services:
  bot:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: smokefree_bot
    restart: always
    env_file:
      - .env
    environment:
      - DATABASE_URL=sqlite+aiosqlite:///./data/smokefree.db
      - PORT=8000
    ports:
      - "8000:8000"
    volumes:
      # Persistent Volume: mounts local ./data on host into container /app/data
      - ./data:/app/data
